
      <label for="elementCategory">Categoría</label>
      <select id="elementCategory" name="elementCategory" required></select>
      <label for="elementImage">Imagen del producto</label>
      <input id="elementImage" name="elementImage" type="file" accept="image/*" aria-label="Seleccionar imagen del producto">
      <div class="image-preview-wrap" id="imagePreviewWrap" hidden>
        <img id="imagePreview" alt="Vista previa del producto">
        <button type="button" class="button button-muted button-small" id="removeImageBtn">Quitar imagen</button>
      </div>
      <p class="form-note">Solo se guardará el nombre, la categoría y la imagen. No se solicitan precios.</p>
